# ROUNDTRIP on its own subdomain.
#
# 1. Replace roundtrip.example.com below with your subdomain.
# 2. sudo cp deploy/nginx/roundtrip.conf /etc/nginx/sites-available/roundtrip.conf
#    sudo ln -s /etc/nginx/sites-available/roundtrip.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d roundtrip.example.com   (adds the 443 block + redirect)
#
# nginx serves the game straight from the repo's public/ folder and proxies
# /api/ to the Node process on 127.0.0.1:8787.

# Files in sites-enabled are included inside http {}, so this is valid here.
limit_req_zone $binary_remote_addr zone=roundtrip_api:10m rate=10r/s;

upstream roundtrip_api {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name roundtrip.example.com;

    root /opt/roundtrip/public;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://twitter.com https://*.twitter.com https://x.com https://*.x.com" always;

    # index.html's card tags need absolute URLs; fill in this host.
    sub_filter '%ORIGIN%' 'https://$host';
    sub_filter_once off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # No build step means no hashed filenames, so code always revalidates
    # (cheap: nginx answers 304 when nothing changed).
    location ~* \.(?:html|js|css|webmanifest)$ {
        expires -1;
    }

    location ~* \.(?:png|mp3|ogg|m4a)$ {
        expires 7d;
    }

    location /api/ {
        limit_req zone=roundtrip_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        proxy_pass http://roundtrip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location ~ /\. {
        deny all;
    }
}
