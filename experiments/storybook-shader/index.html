<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storybook Shader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: the picture fills the page edge to edge; a small paper card of dials sits in the lower corner. */
:root{
  --paper:#fff8ea; --card:rgba(255,248,234,.9); --ink:#5a3b37; --ink-soft:#8a6c63; --rule:rgba(90,59,55,.2);
  --rose:#e58aa3; --rose-deep:#bf5f79; --butter:#f6dd72;
  --display:"Klee One","Hiragino Maru Gothic ProN","Segoe Print",cursive;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.35;overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.hud > *{pointer-events:auto}
.name{pointer-events:none;text-shadow:0 0 6px var(--paper),0 0 12px var(--paper),0 0 2px var(--paper)}
.name h1{margin:0;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.01em;text-wrap:balance}
.name p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px}
.dials{align-self:flex-end;width:min(268px,100%);background:var(--card);border:1px solid var(--rule);border-radius:14px;
  padding:10px 12px;display:flex;flex-direction:column;gap:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1.5px solid var(--ink);
  border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
.sliders{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px 10px}
.sliders label{font-size:13px;white-space:nowrap}
.sliders input{width:100%;min-width:0;margin:0;accent-color:var(--rose-deep)}
#more{display:none}
.split{position:absolute;top:0;bottom:0;left:50%;width:0;pointer-events:none}
.split::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--ink)}
.grip{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 15px/1 var(--body);cursor:ew-resize;
  pointer-events:auto;touch-action:none;padding:0}
.tag{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));white-space:nowrap;font-size:12.5px;font-weight:700;
  background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px}
.tag.l{right:10px}.tag.r{left:10px}
.fail{position:absolute;inset:0;margin:auto;height:max-content;max-width:34ch;text-align:center;padding:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:560px),(max-height:470px){
  .dials{width:100%}
  #more{display:block}
  .dials:not(.open) .sliders{display:none}
  .name h1{font-size:19px}
}
</style>

<div class="stage" id="stage">
  <canvas id="view" aria-label="A girl in a pink coat roller-skating down a path toward a pastel city, drawn by the storybook shader"></canvas>
  <div class="split" id="split" hidden>
    <span class="tag l">plain 3D</span><span class="tag r">with the shader</span>
    <button class="grip" id="grip" type="button" aria-label="Drag to move the comparison line">&#9666;&#9656;</button>
  </div>
  <div class="hud">
    <header class="name">
      <h1>Storybook Shader</h1>
      <p>Drag to look around. Scroll or pinch to zoom.</p>
    </header>
    <section class="dials" id="dials" aria-label="Shader dials">
      <div class="row">
        <button class="btn" id="compare" type="button" aria-pressed="false">Compare</button>
        <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
        <button class="btn" id="more" type="button" aria-expanded="false" aria-controls="sliders">Dials</button>
      </div>
      <div class="sliders" id="sliders">
        <label for="cellSize">Mosaic size</label><input id="cellSize" type="range" min="8" max="40" step="1" value="17">
        <label for="mosaic">Mosaic strength</label><input id="mosaic" type="range" min="0" max="1.4" step="0.05" value="1">
        <label for="ink">Ink lines</label><input id="ink" type="range" min="0" max="1.6" step="0.05" value="1">
        <label for="paper">Paper</label><input id="paper" type="range" min="0" max="1.5" step="0.05" value="1">
      </div>
    </section>
  </div>
  <p class="fail" id="fail" hidden>This picture is drawn live with WebGL 2, which this browser has switched off. Open the page in a current Chrome, Safari, Firefox or Edge to see it.</p>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('view'), stage = $('stage');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance'});
if (!gl) { $('fail').hidden = false; $('dials').hidden = true; return; }
const Q = new URLSearchParams(location.search);          // local testing hooks: ?fixed&z=-40&yaw=1

/* =====================================================================================
   THE SHADER — three pieces. Everything else in this file is just a demo scene for it.
   1. SURFACE  runs on every mesh: soft pastel light + the mosaic of cells inside each fill.
   2. G-BUFFER the surface pass also writes normal / object id / ink weight for the outlines.
   3. POST     one full-screen pass: ink outlines, paper grain, the soft paper border.
   ===================================================================================== */

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aCol;
layout(location=3) in vec4 aMisc;        // material, object id, animated part, ink weight (negative = fades with distance)
uniform mat4 uVP;
uniform mat4 uParts[8];                  // 0 = the still world, 1.. = the character's moving parts
out vec3 vWorld; out vec3 vPat; out vec3 vNrm; out vec3 vPatNrm; out vec3 vCol;
flat out vec4 vMisc;
invariant gl_Position;
void main(){
  mat4 M = uParts[int(aMisc.z + 0.5)];
  vec4 w = M * vec4(aPos, 1.0);
  vWorld = w.xyz;
  vPat = aPos;                           // the pattern lives in REST space, so cells stick to a moving body
  vNrm = mat3(M) * aNrm; vPatNrm = aNrm;
  vCol = aCol; vMisc = aMisc;
  gl_Position = uVP * w;
}`;

const FS_DEPTH = `#version 300 es
precision mediump float;
void main(){}`;

const FS_SURFACE = `#version 300 es
precision highp float; precision highp int;
in vec3 vWorld; in vec3 vPat; in vec3 vNrm; in vec3 vPatNrm; in vec3 vCol;
flat in vec4 vMisc;
layout(location=0) out vec4 oCol;        // rgb = painted colour, a = unused
layout(location=1) out vec4 oNid;        // xy = normal (octahedral), z = ink weight, w = object id

uniform vec3 uCam, uSun, uHaze, uGirl;
uniform float uPxAngle;                  // world units covered by one reference pixel at distance 1
uniform float uPxScale;                  // device pixels per reference pixel (the look is authored at 720p)
uniform float uCellPx, uCellAmt, uSplitX, uFog;
uniform vec4 uMA[13], uMB[13], uMC[13], uMD[13];   // per-material look, see defMat() below
uniform vec3 uPathCol, uGrassCol;

// ---- integer hash: identical on every GPU, no sin() banding
uvec3 pcg3(uvec3 v){
  v = v*1664525u + 1013904223u;
  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;
  v ^= v >> 16u;
  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;
  return v;
}
vec3 h33(vec3 c){ return vec3(pcg3(uvec3(ivec3(c)))) * (1.0/4294967296.0); }

// ---- the demo's path, as a formula shared with the JS side
float pathX(float z){
  float env = (1.0 - smoothstep(-48.0, -12.0, z)) * smoothstep(-185.0, -150.0, z);
  return env * (4.6*sin(z*0.043+0.4) + 1.9*sin(z*0.097+1.9));
}
float pathDist(vec2 p){                  // negative on the path
  float s = (pathX(p.y+0.1) - pathX(p.y-0.1)) * 5.0;
  return abs(p.x - pathX(p.y)) / sqrt(1.0+s*s) - (1.45 + 0.14*sin(p.y*0.31));
}

// ---- one mosaic cell: 3D Voronoi sliced by the surface
struct Cell { float d; vec3 seed; vec3 h; float k; };
// d = distance to the cell border in reference pixels, seed = the cell's centre in pattern space,
// h = three random numbers for this cell, k = a random number shared by a clump of neighbouring cells
Cell voro(vec3 p, float cw, vec3 S, float jit, vec3 nrm, float pxW){
  vec3 x = p*S/cw;
  vec3 ip = floor(x), f = x - ip;
  float d1 = 1e9, d2 = 1e9; vec3 r1 = vec3(0.0), r2 = vec3(0.0), c1 = vec3(0.0);
  for(int k=-1;k<=1;k++) for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec3 g = vec3(float(i),float(j),float(k));
    vec3 r = g + 0.5 + jit*(h33(ip+g)-0.5) - f;
    float d = dot(r,r);
    if(d<d1){ d2=d1; r2=r1; d1=d; r1=r; c1=ip+g; }
    else if(d<d2){ d2=d; r2=r; }
  }
  vec3 e = r2 - r1; vec3 en = e/max(length(e),1e-5);
  float pd = dot(0.5*(r1+r2), en);                   // distance to the wall between the two nearest seeds
  vec3 m = en*S; float ml = max(length(m),1e-5);
  float c = dot(m/ml, nrm);
  float sinA = sqrt(max(1.0-c*c, 0.06));             // the surface cuts that wall at an angle; undo it so
  Cell o;                                            // every line comes out the same width on screen
  o.d = pd*cw/(ml*sinA)/pxW;
  o.seed = (x + r1)*cw/S;
  o.h = h33(c1 + vec3(31.0,17.0,5.0));
  o.k = h33(floor((x + r1)*0.31) + vec3(9.0,3.0,71.0)).x;
  return o;
}

// ---- paint one cell
vec3 paintCell(Cell c, vec3 base, int mat, float ndl, float aa, float amt){
  vec4 MA = uMA[mat], MB = uMB[mat], MC = uMC[mat], MD = uMD[mat];
  vec3 col = base; vec3 alt = MA.rgb; float altAmt = MA.a; float vj = MB.w; float lineAmt = MC.x;
  vec3 lineCol = MD.rgb; float lineAbs = MD.a;
  if(mat == 0){                                      // ground: each cell is either path or grass,
    if(pathDist(c.seed.xz) < 0.0){                   // decided at its centre, so the path edge is cell-shaped
      col = uPathCol*mix(vec3(1.0), base, 0.6); alt = col*vec3(0.985,0.95,0.93); altAmt = 0.35; vj = 0.035;
      lineAmt = 0.42*step(0.42, c.h.x); lineCol = vec3(0.92,0.84,0.76); lineAbs = 0.0;
    } else col = uGrassCol*base;
  }
  // some cells take the second colour, in clumps (the yellow leaves among the green)
  float pick = step(1.0 - altAmt, c.h.x*0.55 + c.k*0.45);
  col = mix(col, alt, pick*amt);
  col *= 1.0 + (c.h.y-0.5)*2.0*vj*amt;
  // soft light, nudged per cell so the shading is faceted like tiles instead of a smooth 3D gradient
  float lit = smoothstep(-0.6, 0.8, ndl + (c.h.z-0.5)*0.55*amt);
  col *= mix(vec3(1.0), mix(vec3(0.875,0.86,0.905), vec3(1.03,1.02,0.985), lit), MC.z);
  col *= 1.0 + MC.y*amt*(smoothstep(0.0, 5.0, c.d) - 0.7);     // each cell a touch darker at its rim
  // the thin line between cells
  float ln = 1.0 - smoothstep(0.55-aa, 0.55+aa, c.d);
  vec3 lc = mix(col*lineCol, lineCol, lineAbs);
  return mix(col, lc, ln*lineAmt*min(amt,1.0));
}

vec2 octEnc(vec3 n){
  n /= (abs(n.x)+abs(n.y)+abs(n.z));
  vec2 e = n.z >= 0.0 ? n.xy : (1.0-abs(n.yx))*vec2(n.x>=0.0?1.0:-1.0, n.y>=0.0?1.0:-1.0);
  return e*0.5+0.5;
}

void main(){
  int mat = int(vMisc.x + 0.5);
  vec3 N = normalize(vNrm);
  float dist = length(uCam - vWorld);
  float ndl = dot(N, uSun);
  float fog = 1.0 - exp(-dist*uFog);
  float inkW = abs(vMisc.w)*(1.0 - fog*0.7);
  if(vMisc.w < 0.0) inkW *= 1.0 - smoothstep(5.0, 16.0, dist);   // tiny props (flowers) drop their outline far away
  oNid = vec4(octEnc(N), inkW, vMisc.y/255.0);

  if(gl_FragCoord.x < uSplitX){                      // "Compare": the same mesh with ordinary shading
    vec3 b = vCol;
    if(mat == 0) b = mix(uPathCol, uGrassCol*vCol, smoothstep(-0.05, 0.05, pathDist(vWorld.xz)));
    b *= 0.52 + 0.6*max(ndl, 0.0);
    oCol = vec4(mix(b, vec3(0.74,0.83,0.93), fog*0.85), 1.0);
    return;
  }

  // Cell size is chosen in SCREEN pixels, then snapped to a power of two in world units.
  // The cells stay glued to the surface, yet read the same size near and far.
  float pxW = dist*uPxAngle;
  float want = pxW*uCellPx*uMB[mat].x;
  float l = log2(want), l0 = floor(l), f = l - l0;
  float cw = exp2(l0);
  vec3 S = vec3(1.0, uMB[mat].y, 1.0);               // stretch: long cells for bark and hair strands
  vec3 Np = normalize(vPatNrm);
  vec3 P = mat == 0 ? vPat : vPat + vMisc.y*3.7;   // shift the pattern per object so neighbours don't line up
  float aa = 0.6/uPxScale;
  Cell a = voro(P, cw, S, uMB[mat].z, Np, pxW);
  // calm the cells where a surface is seen edge-on, or far ground turns into streaks
  float amt = uCellAmt*clamp(abs(dot(N, uCam - vWorld))/dist*8.0, 0.35, 1.0);
  vec3 col = paintCell(a, vCol, mat, ndl, aa, amt);
  float t = smoothstep(0.3, 1.0, f);
  if(t > 0.0){                                       // nearing the next size up: cells merge one at a time
    Cell b = voro(P, cw*2.0, S, uMB[mat].z, Np, pxW);
    float w = smoothstep(-0.12, 0.12, t*1.24 - 0.12 - b.h.z);
    if(w > 0.0) col = mix(col, paintCell(b, vCol, mat, ndl, aa, amt), w);
  }
  if(mat == 0){                                      // soft blob of shade under the skater
    float sh = 1.0 - smoothstep(0.1, 0.62, length(vWorld.xz - uGirl.xz));
    col *= mix(vec3(1.0), vec3(0.85,0.79,0.84), sh*0.85);
  }
  col = mix(col, uHaze, fog*0.9);                    // far things fade toward the paper
  oCol = vec4(col, 1.0);
}`;

const VS_POST = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

const FS_POST = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D tCol, tNid, tDepth;
uniform vec2 uRes, uTan;
uniform float uPxScale, uTime, uInk, uPaper, uSplitX, uFade, uNear, uFar, uBorder;
uniform vec3 uRight, uUp, uFwd;
out vec4 outColor;

float h21(vec2 p){
  uvec2 q = uvec2(ivec2(floor(p)));
  uint n = q.x*1597334673u ^ q.y*3812015801u;
  n = (n ^ (n>>15u))*2246822519u; n ^= n>>13u;
  return float(n)*(1.0/4294967296.0);
}
float vn(vec2 p){
  vec2 i = floor(p), f = p - i; f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1.0,0.0)), f.x), mix(h21(i+vec2(0.0,1.0)), h21(i+vec2(1.0,1.0)), f.x), f.y);
}
float fbm(vec2 p){ return 0.5*vn(p) + 0.3*vn(p*2.07+7.0) + 0.2*vn(p*4.3+19.0); }
vec3 octDec(vec2 e){
  e = e*2.0-1.0; vec3 v = vec3(e, 1.0-abs(e.x)-abs(e.y));
  if(v.z < 0.0) v.xy = (1.0-abs(v.yx))*vec2(v.x>=0.0?1.0:-1.0, v.y>=0.0?1.0:-1.0);
  return normalize(v);
}
float linZ(float d){ return uNear*uFar/(uFar - d*(uFar-uNear)); }

vec3 sky(vec3 rd, bool plain){
  float y = clamp(rd.y, -0.1, 1.0);
  if(plain) return mix(vec3(0.80,0.88,0.96), vec3(0.50,0.69,0.93), smoothstep(0.0, 0.5, y));
  vec3 c = mix(vec3(0.992,0.925,0.835), vec3(0.996,0.968,0.93), smoothstep(0.0, 0.32, y));
  vec2 q = rd.xz/(abs(rd.y)+0.14);
  float cl = fbm(q*1.2 + 3.0);
  return mix(c, vec3(0.895,0.93,0.965), smoothstep(0.46, 0.74, cl)*0.6*smoothstep(0.03, 0.22, y));
}

// is there an outline between the centre pixel and this neighbour?
float edge(vec4 a, vec3 na, vec4 b){
  float e = step(0.5/255.0, abs(a.a - b.a));                       // different object
  if(a.a > 0.0 && b.a > 0.0) e = max(e, smoothstep(0.80, 0.45, dot(na, octDec(b.xy))));   // sharp crease
  return e;
}

const vec2 TAP[4] = vec2[4](vec2(0.7,0.7), vec2(0.7,-0.7), vec2(1.7,0.0), vec2(0.0,1.7));

void main(){
  vec2 fc = gl_FragCoord.xy, uv = fc/uRes;
  vec2 ndc = uv*2.0-1.0;
  vec3 rd = normalize(uFwd + uRight*ndc.x*uTan.x + uUp*ndc.y*uTan.y);
  float dC = texture(tDepth, uv).r;
  if(fc.x < uSplitX){                                              // "Compare": untouched render
    outColor = vec4(dC < 1.0 ? texture(tCol, uv).rgb : sky(rd, true), 1.0);
    return;
  }
  vec3 paper = vec3(1.0, 0.975, 0.925);
  vec2 rp = fc/uPxScale;                                           // position in 720p reference pixels
  vec3 col = dC < 1.0 ? texture(tCol, uv).rgb : sky(rd, false);

  // ---- ink outlines. The lookups wobble a little, like a line drawn by hand over the paint.
  float boil = floor(uTime*7.0);
  vec2 wob = (vec2(vn(rp*0.04 + vec2(boil*3.1, 7.0)), vn(rp*0.04 + vec2(31.0, boil*5.3))) - 0.5)*1.8;
  vec2 euv = (fc + wob*uPxScale)/uRes;
  vec2 px = uPxScale/uRes;
  vec4 n0 = texture(tNid, euv); float d0 = texture(tDepth, euv).r;
  vec3 nn0 = octDec(n0.xy);
  float z0 = linZ(d0), K = (uFar-uNear)/(uNear*uFar);
  float cosV = max(abs(dot(nn0, rd)), 0.02), tanV = sqrt(1.0 - cosV*cosV)/cosV;
  float pxAng = 2.0*uTan.y/uRes.y*uPxScale;                        // angle covered by one reference pixel
  float eIn = 0.0, eOut = 0.0, ink = 0.0;
  vec3 dark = texture(tCol, euv).rgb;
  if(d0 >= 1.0) dark = col;
  for(int p=0;p<4;p++){
    vec2 o = TAP[p]*px;
    vec4 na = texture(tNid, euv+o), nb = texture(tNid, euv-o);
    float da = texture(tDepth, euv+o).r, db = texture(tDepth, euv-o).r;
    float ea = edge(n0, nn0, na), eb = edge(n0, nn0, nb);
    // a step in depth inside one object (a fold, one leaf clump in front of another). Depth is
    // linear across a flat surface in screen space, so only a real step makes this non-zero.
    if(d0 < 1.0 && da < 1.0 && db < 1.0){
      // The bar rises where the surface is seen edge-on (tanV), or rolling ground far away reads as a step.
      float T = 0.012 + 2.5*tanV*length(TAP[p])*pxAng;
      float ed = smoothstep(T, 2.5*T, abs(da + db - 2.0*d0)*K*z0);
      ea = max(ea, ed); eb = max(eb, ed);
    }
    // an outline belongs to whichever surface is in front
    ink = max(ink, max(ea*(da < d0 ? na.z : n0.z), eb*(db < d0 ? nb.z : n0.z)));
    if(p < 2){ eIn += ea + eb; if(ea+eb > 0.0) dark = min(dark, min(texture(tCol, euv+o).rgb, texture(tCol, euv-o).rgb)); }
    else eOut += ea + eb;
  }
  // inner ring = a thin line for everything; outer ring only counts for heavy-ink objects (the character)
  float line = max(smoothstep(0.0, 0.6, eIn*0.25), smoothstep(0.0, 0.6, eOut*0.25)*smoothstep(0.5, 0.85, ink));
  float grain = vn(rp*1.7)*0.6 + vn(rp*0.55 + 40.0)*0.4;
  float a = clamp(line*mix(0.3, 1.0, ink)*smoothstep(0.0, 0.12, ink)*uInk*(0.74 + 0.4*grain), 0.0, 1.0);
  vec3 inkCol = mix(dark*0.56, vec3(0.37,0.235,0.215), 0.22 + 0.48*ink);     // coloured ink, never black
  col = mix(col, inkCol, a);

  // ---- paper
  float lum = dot(col, vec3(0.3,0.59,0.11));
  col -= uPaper*0.075*(grain-0.5)*(1.25-lum);                      // pigment settles into the grain

    if(ok(a)&&ok(b)&&ok(c)) i.push(a,c,b); if(ok(b)&&ok(c)&&ok(d)) i.push(b,c,d); }

/* ---------- render targets ---------- */
const fbo = gl.createFramebuffer();
let tCol = null, tNid = null, tDepth = null, rw = 0, rh = 0;
function makeTargets(w, h){
  for(const t of [tCol, tNid, tDepth]) if(t) gl.deleteTexture(t);
  const tex = (ifmt, fmt, type) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
    for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    return t; };
  tCol = tex(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE); tNid = tex(gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
  tDepth = tex(gl.DEPTH_COMPONENT24, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tCol, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, tNid, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, tDepth, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  rw = w; rh = h;
}

/* ---------- state ---------- */
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const Z0 = -4, Z1 = -160;
const S = { cell:17, amt:1, ink:1, paper:1, compare:false, split:0.5, paused:reduce,
  z: Q.has('z') ? +Q.get('z') : Z0, time:0, phase: +Q.get('phase') || 0, fadeIn:0,
  yaw: Q.has('yaw') ? +Q.get('yaw') : 0, pitch: Q.has('pitch') ? +Q.get('pitch') : -0.1, dist: Q.has('dist') ? +Q.get('dist') : 3.3,
  camYaw:0, scale:1 };
if(Q.has('pause')) S.paused = true;
if(Q.has('split')){ S.compare = true; S.split = +Q.get('split'); }
S.camYaw = Math.atan(pathSlope(S.z));
const NEAR = 0.25, FAR = 900;
const SUN = norm([-0.5, 0.74, 0.46]);
const parts = new Float32Array(8*16);

function resize(){
  const cw = stage.clientWidth, ch = stage.clientHeight;
  if(!cw || !ch) return false;
  let pr = Math.min(window.devicePixelRatio || 1, 2)*S.scale;
  const cap = 2.3e6; if(cw*ch*pr*pr > cap) pr = Math.sqrt(cap/(cw*ch));
  const w = Math.max(2, Math.round(cw*pr)), h = Math.max(2, Math.round(ch*pr));
  if(w !== canvas.width || h !== canvas.height){ canvas.width = w; canvas.height = h; }
  if(w !== rw || h !== rh) makeTargets(w, h);
  return true;
}

function pose(gx, gz, yaw){
  const s = Math.sin(S.phase), sp = Math.pow(Math.max(s,0),1.4), sn = Math.pow(Math.max(-s,0),1.4);
  const root = mm(T(gx, 0.012*Math.cos(S.phase*2), gz), RY(yaw));
  const piv = (p, M) => mm(T(p[0],p[1],p[2]), M, T(-p[0],-p[1],-p[2]));
  const torso = mm(root, T(0.03*s,0,0), piv(TORSO, mm(RZ(-0.06*s), RX(-0.13))));
  const set = (i, M) => parts.set(M, i*16);
  set(0, I4()); set(1, torso);
  set(2, mm(torso, piv(NECK, mm(RZ(0.05*s), RX(0.1)))));
  set(3, mm(torso, piv([-SHOULDER[0],SHOULDER[1],0], mm(RX(0.42*s), RZ(-0.06)))));
  set(4, mm(torso, piv([SHOULDER[0],SHOULDER[1],0], mm(RX(-0.42*s), RZ(0.06)))));
  set(5, mm(root, T(0.03*s,0,0), piv([-HIP[0],HIP[1],0], mm(RX(0.5*sp-0.14*sn), RZ(-0.24*sp)))));
  set(6, mm(root, T(0.03*s,0,0), piv([HIP[0],HIP[1],0], mm(RX(0.5*sn-0.14*sp), RZ(0.24*sn)))));
}

let last = 0, slow = 0, frames = 0;
function frame(now){
  if(Q.has('once') && frames >= 2) return;
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000 || 0); last = now;
  if(!resize()) return;
  if(!S.paused){
    S.time += dt; S.phase += dt*4.9;
    S.z -= dt*3.5/Math.hypot(1, pathSlope(S.z));
    S.fadeIn = Math.max(0, S.fadeIn - dt/1.1);
    if(S.z < Z1){ S.z = Z0; S.fadeIn = 1; S.camYaw = 0; }
  }
  const gz = S.z, gx = pathX(gz), psi = Math.atan(pathSlope(gz));
  S.camYaw += (psi - S.camYaw)*(1 - Math.exp(-dt*2.2));
  pose(gx, gz, psi);

  const W = canvas.width, H = canvas.height, asp = W/H;
  const fov = 0.66 + 0.27*clamp((1.25-asp)/0.6, 0, 1);
  const Y = S.camYaw + S.yaw, P = S.pitch;
  const right = [Math.cos(Y), 0, -Math.sin(Y)];
  const truck = clamp((asp-1.1)*0.9, 0, 0.62)*S.dist/3.3;
  const tgt = [gx + right[0]*truck, 0.95, gz + right[2]*truck];
  const eye = [tgt[0] + S.dist*Math.sin(Y)*Math.cos(P), tgt[1] + S.dist*Math.sin(P), tgt[2] + S.dist*Math.cos(Y)*Math.cos(P)];
  eye[1] = Math.max(eye[1], groundH(eye[0], eye[2]) + 0.2);
  const V = lookAt(eye, tgt, [0,1,0]), VP = mul(persp(fov, asp, NEAR, FAR), V);
  const fwd = norm(sub(tgt, eye)), rgt = norm(cross(fwd, [0,1,0])), up = cross(rgt, fwd);
  const pxScale = H/720, th = Math.tan(fov/2);
  const splitX = S.compare ? Math.round(S.split*W) : 0;
  const fade = Math.max(S.fadeIn, smooth(Z1+7, Z1, gz));

  // ---- pass 1: lay down depth first, so the costly surface shader only runs on pixels that end up visible
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.colorMask(true, true, true, true);
  gl.clearBufferfv(gl.COLOR, 0, [1, 0.97, 0.92, 1]); gl.clearBufferfv(gl.COLOR, 1, [0.5, 0.5, 0, 0]);
  gl.clearBufferfv(gl.DEPTH, 0, [1]);
  gl.bindVertexArray(vao);
  gl.useProgram(progDepth.p);
  gl.uniformMatrix4fv(progDepth.u('uVP'), false, VP); gl.uniformMatrix4fv(progDepth.u('uParts'), false, parts);
  gl.colorMask(false, false, false, false); gl.depthFunc(gl.LESS);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 2);     // a hair behind, so the real pass always wins
  gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  gl.useProgram(progSurf.p);
  const u = progSurf.u;
  gl.uniformMatrix4fv(u('uVP'), false, VP); gl.uniformMatrix4fv(u('uParts'), false, parts);
  gl.uniform3fv(u('uCam'), eye); gl.uniform3fv(u('uSun'), SUN); gl.uniform3f(u('uHaze'), 0.975, 0.94, 0.885);
  gl.uniform3f(u('uGirl'), gx, 0, gz);
  gl.uniform1f(u('uPxAngle'), 2*th/720); gl.uniform1f(u('uPxScale'), pxScale);
  gl.uniform1f(u('uCellPx'), S.cell); gl.uniform1f(u('uCellAmt'), S.amt); gl.uniform1f(u('uSplitX'), splitX); gl.uniform1f(u('uFog'), 0.0055);
  gl.uniform4fv(u('uMA'), mA); gl.uniform4fv(u('uMB'), mB); gl.uniform4fv(u('uMC'), mC); gl.uniform4fv(u('uMD'), mD);
  gl.uniform3f(u('uPathCol'), 0.985, 0.835, 0.64); gl.uniform3f(u('uGrassCol'), 0.80, 0.82, 0.50);
  gl.colorMask(true, true, true, true); gl.depthFunc(gl.LEQUAL);
  gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);

  // ---- pass 2: ink and paper
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.useProgram(progPost.p);
  const q = progPost.u;
  [tCol, tNid, tDepth].forEach((t, i) => { gl.activeTexture(gl.TEXTURE0+i); gl.bindTexture(gl.TEXTURE_2D, t); });
  gl.uniform1i(q('tCol'), 0); gl.uniform1i(q('tNid'), 1); gl.uniform1i(q('tDepth'), 2);
  gl.uniform2f(q('uRes'), W, H); gl.uniform2f(q('uTan'), th*asp, th);
  gl.uniform1f(q('uPxScale'), pxScale); gl.uniform1f(q('uTime'), S.time); gl.uniform1f(q('uInk'), S.ink); gl.uniform1f(q('uPaper'), S.paper);
  gl.uniform1f(q('uSplitX'), splitX); gl.uniform1f(q('uFade'), fade); gl.uniform1f(q('uNear'), NEAR); gl.uniform1f(q('uFar'), FAR);
  gl.uniform1f(q('uBorder'), 30*Math.min(1, Math.min(W,H)/pxScale/720 + 0.25));
  gl.uniform3fv(q('uRight'), rgt); gl.uniform3fv(q('uUp'), up); gl.uniform3fv(q('uFwd'), fwd);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.__sbFrames = ++frames;

  // slow device: quietly render fewer pixels
  if(!Q.has('fixed')){
    slow = dt > 0.034 ? slow+1 : Math.max(0, slow-2);
    if(slow > 24 && S.scale > 0.5){ S.scale *= 0.84; slow = 0; }
  }
}

/* ---------- controls ---------- */
const bind = (id, key) => { const el = $(id); el.addEventListener('input', () => { S[key] = +el.value; }); S[key] = +el.value; };
bind('cellSize', 'cell'); bind('mosaic', 'amt'); bind('ink', 'ink'); bind('paper', 'paper');
for(const k of ['cell','amt','ink','paper']) if(Q.has(k)) S[k] = +Q.get(k);
const splitEl = $('split'), cmp = $('compare'), pauseBtn = $('pause'), moreBtn = $('more'), dials = $('dials');
function syncUi(){
  splitEl.hidden = !S.compare; splitEl.style.left = (S.split*100)+'%';
  cmp.setAttribute('aria-pressed', S.compare);
  pauseBtn.textContent = S.paused ? 'Skate' : 'Pause'; pauseBtn.setAttribute('aria-pressed', S.paused);
}
cmp.addEventListener('click', () => { S.compare = !S.compare; syncUi(); });
pauseBtn.addEventListener('click', () => { S.paused = !S.paused; syncUi(); });
moreBtn.addEventListener('click', () => { const o = dials.classList.toggle('open'); moreBtn.setAttribute('aria-expanded', o); });
const grip = $('grip');
grip.addEventListener('pointerdown', e => { grip.setPointerCapture(e.pointerId); e.preventDefault(); });
grip.addEventListener('pointermove', e => {
  if(!grip.hasPointerCapture(e.pointerId)) return;
  const r = stage.getBoundingClientRect(); S.split = clamp((e.clientX-r.left)/r.width, 0.04, 0.96); syncUi();
});
grip.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ S.split = clamp(S.split + (e.key === 'ArrowLeft' ? -0.03 : 0.03), 0.04, 0.96); syncUi(); e.preventDefault(); }
});
const ptrs = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX-p[0], dy = e.clientY-p[1]; p[0] = e.clientX; p[1] = e.clientY;
  if(ptrs.size === 1){ S.yaw -= dx*0.006; S.pitch = clamp(S.pitch + dy*0.005, -0.3, 1.2); }
  else if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    if(pinch) S.dist = clamp(S.dist*pinch/d, 1.7, 9); pinch = d;
  }
});
const drop = e => { ptrs.delete(e.pointerId); pinch = 0; };
canvas.addEventListener('pointerup', drop); canvas.addEventListener('pointercancel', drop);
canvas.addEventListener('wheel', e => { S.dist = clamp(S.dist*Math.exp(e.deltaY*0.0012), 1.7, 9); e.preventDefault(); }, {passive:false});
canvas.addEventListener('dblclick', () => { S.yaw = 0; S.pitch = -0.1; S.dist = 3.3; });
syncUi();
requestAnimationFrame(frame);
})();
</script>
